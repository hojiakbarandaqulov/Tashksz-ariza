services:
  toshksz-bot:
    build:
      # Docker JARni o'zi yig'ishi uchun build konteksti loyiha ildizi bo'ladi.
      context: ..
      dockerfile: deploy/Dockerfile
    image: toshksz-bot:latest
    container_name: toshksz-bot
    # PostgreSQL hostning 127.0.0.1:5432 manzilida ishlayotgani uchun Linux host network ishlatiladi.
    network_mode: host
    env_file:
      - ./toshksz-bot.env
    restart: unless-stopped
    stop_grace_period: 30s
